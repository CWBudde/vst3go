name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.24.3"
  # Pinned so the conformance bar cannot move underneath a green build. Bump it
  # deliberately; the cache key below follows it.
  VST3_SDK_REF: "58f8da7936800732561402d7936584ca4505de07"

jobs:
  build:
    name: build / vet / test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Every package here is cgo, so a missing C compiler fails as a confusing
      # "undefined symbol" wall further down. Say so up front instead.
      - name: report the C toolchain
        # bash rather than the Windows default shell, so one script covers all
        # three runners.
        shell: bash
        run: |
          go env CC CGO_ENABLED
          cc --version || gcc --version

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: go tool cover -func=coverage.out | tail -n 1

      - name: upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: golangci/golangci-lint-action@v6
        with:
          version: v2.1.6
          args: --timeout=5m ./pkg/...

  format:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: gofmt
        run: |
          unformatted=$(gofmt -l pkg/)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

  cbridge:
    name: C bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install the MinGW-w64 cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64

      - name: compile the bridge standalone
        run: |
          # -Wno-unused-parameter: COM vtable slots must match the SDK
          # signature whether or not the stub uses every argument.
          #
          # The bridge is compiled for Windows too: SMTG_STDMETHODCALLTYPE is
          # __stdcall there and empty everywhere else, so a vtable signature
          # can be well-formed on Linux and wrong on Windows.
          for cc in gcc x86_64-w64-mingw32-gcc; do
            for f in bridge/*.c; do
              "$cc" -fsyntax-only -Wall -Wextra -Wno-unused-parameter \
                -Werror -Iinclude -Ibridge "$f"
            done
          done

  plugin-smoke:
    name: plugin smoke test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Enables the cross-build half of the export-table test, which is what
      # keeps Windows support honest without needing a Windows host: the
      # entry points a host resolves by name are only reachable through Go's
      # //export mechanism on PE, and nothing else in the build would notice
      # if that regressed.
      - name: install the MinGW-w64 cross compiler
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64

      # Nothing else in the repo links pkg/plugin into a loadable module, so
      # without this the entire cgo wrapper surface is unproven.
      - name: build and exercise a minimal plugin
        run: go test -tags smoke -race -count=1 ./test/smoke/...

  validator:
    name: Steinberg validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # include/vst3 carries only the C API headers. The validator is a C++
      # program in the full SDK, which is why it is fetched separately here
      # rather than vendored.
      - name: cache the validator
        id: validator-cache
        uses: actions/cache@v4
        with:
          path: ~/vst3-validator
          key: vst3-validator-${{ runner.os }}-${{ env.VST3_SDK_REF }}

      - name: install SDK build dependencies
        if: steps.validator-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxext-dev libxi-dev libice-dev libsm-dev

      - name: build the validator
        if: steps.validator-cache.outputs.cache-hit != 'true'
        run: |
          set -eux
          git init vst3sdk
          cd vst3sdk
          git remote add origin https://github.com/steinbergmedia/vst3sdk.git
          git fetch --depth 1 origin "$VST3_SDK_REF"
          git checkout FETCH_HEAD
          git submodule update --init --recursive --depth 1

          # editorhost and audiohost are GUI sample hosts that pull in gtkmm;
          # dropping them keeps this job to the console validator we actually
          # need. audiohost goes too because it compiles editorhost's sources.
          rm -rf public.sdk/samples/vst-hosting/editorhost \
                 public.sdk/samples/vst-hosting/audiohost

          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF \
            -DSMTG_CREATE_PLUGIN_LINK=OFF
          cmake --build build --target validator -j "$(nproc)"

          mkdir -p ~/vst3-validator
          cp "$(find build -type f -name validator -perm -u+x | head -1)" ~/vst3-validator/

      # Steinberg's own conformance suite: it grades the runtime against the
      # specification rather than against our reading of it.
      - name: run the validator against a minimal plugin
        env:
          VST3_VALIDATOR: /home/runner/vst3-validator/validator
        run: go test -tags validator -count=1 -v ./test/smoke/...
