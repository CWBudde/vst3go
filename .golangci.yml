version: "2"
run:
  issues-exit-code: 1
  tests: true
linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - dogsled
    - dupl
    - errcheck
    - funlen
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - mnd
    - nakedret
    - noctx
    - nolintlint
    - revive
    - rowserrcheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    dupl:
      threshold: 100
    funlen:
      lines: 100
      statements: 50
    goconst:
      min-len: 3
      min-occurrences: 3
    gocritic:
      disabled-checks:
        - dupImport
        - ifElseChain
        - octalLiteral
        - whyNoLint
        - wrapperFunc
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    gocyclo:
      min-complexity: 15
    govet:
      enable:
        - shadow
    lll:
      line-length: 140
    misspell:
      locale: US
    revive:
      rules:
        - name: file-length-limit
          arguments:
            - max: 1500
              skip-comments: false
              skip-blank-lines: false
      enable-default-rules: true
  exclusions:
    generated: lax
    rules:
      # Test tables legitimately repeat short literals and use throwaway
      # closure parameters; neither is worth a named constant.
      - linters:
          - funlen
          - goconst
          - gocyclo
          - gosec
          - mnd
          - revive
        path: _test\.go
      - linters:
          - revive
          - staticcheck
        path: pkg/vst3/
      - linters:
          - revive
          - staticcheck
        path: bridge/
      - linters:
          - funlen
          - revive
        path: pkg/plugin/wrapper.*\.go
      - linters:
          - mnd
        path: pkg/framework/bus/
      - linters:
          - gocritic
          - lll
          - mnd
        path: pkg/vst3/
      # govet and staticcheck stay ON for pkg/plugin: it is the cgo package
      # that most needs them. Only the shadow check is excluded, because the
      # cgo callback signatures unavoidably shadow package names.
      - linters:
          - dupl
          - gocritic
          - gocyclo
          - lll
          - mnd
          - revive
        path: pkg/plugin/
      - linters:
          - govet
        path: pkg/plugin/
        text: shadow
      - linters:
          - gosec
          - mnd
        path: pkg/framework/param/
    paths:
      - build
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
